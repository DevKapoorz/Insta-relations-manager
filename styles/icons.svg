<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <defs>
        <!-- App Logo Icon -->
        <symbol id="icon-logo" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="16" fill="#4f46e5" />
            <circle cx="25" cy="25" r="8" fill="white" />
            <circle cx="43" cy="29" r="6" fill="#c7d2fe" />
            <path d="M11 48c1-10 7-15 14-15s13 5 14 15" fill="white" />
            <path d="M36 48c1-7 5-11 10-11 4 0 7 2 9 6" fill="none" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round" />
        </symbol>

        <!-- Dropzone Upload Icon -->
        <symbol id="icon-upload" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
        </symbol>

        <!-- Privacy Shield Lock Icon -->
        <symbol id="icon-lock" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </symbol>

        <!-- Loading File Icon -->
        <symbol id="icon-file-archive" viewBox="0 0 24 24">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </symbol>

        <!-- Chevron Down Arrow (Custom Select) -->
        <symbol id="icon-chevron-down" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"></polyline>
        </symbol>

        <!-- Checkmark (Custom Option) -->
        <symbol id="icon-check" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
        </symbol>

        <!-- Stat: Who don't follow back (User X) -->
        <symbol id="icon-user-x" viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <line x1="17" y1="8" x2="23" y2="14"></line>
            <line x1="23" y1="8" x2="17" y2="14"></line>
        </symbol>

        <!-- Stat: Who you don't follow back (User Check / Users) -->
        <symbol id="icon-user-check" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </symbol>

        <!-- Clock / Pending Icon -->
        <symbol id="icon-clock" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </symbol>

        <!-- Search Icon (No Results) -->
        <symbol id="icon-search" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
        </symbol>

        <!-- Chevron Up / Caret Icon -->
        <symbol id="icon-chevron-up" viewBox="0 0 24 24">
            <polyline points="18 15 12 9 6 15"></polyline>
        </symbol>

        <!-- Back to Top Arrow Icon -->
        <symbol id="icon-arrow-up" viewBox="0 0 24 24">
            <path d="M18 15l-6-6-6 6"></path>
        </symbol>
    
        <!-- Theme Toggle Sun Icon -->
        <symbol id="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </symbol>

        <!-- Theme Toggle Moon Icon -->
        <symbol id="icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </symbol>
    </defs>
</svg>
